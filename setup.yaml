schemaVersion: 2

project:
  name: ai-tools-omniroute
  type: docker-compose
  description: Build omniroute-cli, pull OmniRoute/Open WebUI images and recreate the ai-tools-omniroute stack.

defaults:
  timeout: 20m
  failFast: true

requirements:
  commands:
    - docker
  optionalCommands:
    - go
    - just

workflows:
  setup:
    tasks: [build-cli, rebuild]
  update:
    tasks: [build-cli, rebuild]
  rebuild:
    tasks: [rebuild]
  build-cli:
    tasks: [build-cli]
  check-cli:
    tasks: [check-cli]
  pull:
    tasks: [pull]
  start:
    tasks: [start]
  stop:
    tasks: [stop]
  status:
    tasks: [status]

tasks:
  prepare-env:
    steps:
      - name: Create .env from .env.example when missing
        copy:
          source: .env.example
          target: .env
          overwrite: false
        when:
          all:
            - fileExists: .env.example
            - not:
                fileExists: .env

      - name: Create .env from visible env.example fallback
        copy:
          source: env.example
          target: .env
          overwrite: false
        when:
          all:
            - fileExists: env.example
            - not:
                fileExists: .env

      - name: Migrate obsolete Open WebUI Docker Hub tag
        shell: |
          if grep -q '^OPENWEBUI_IMAGE=openwebui/open-webui:main$' .env; then
            sed -i.bak 's#^OPENWEBUI_IMAGE=openwebui/open-webui:main$#OPENWEBUI_IMAGE=openwebui/open-webui:latest#' .env
            rm -f .env.bak
            echo "Migrated Open WebUI image tag: main -> latest"
          fi
        when:
          fileExists: .env

  validate:
    requires: [prepare-env]
    steps:
      - name: Validate Docker Compose configuration
        dockerCompose:
          action: config
          args: [--quiet]

  check-cli:
    steps:
      - name: Run Go tests
        command:
          exec: go
          args: [test, ./...]
        when:
          commandExists: go

  build-cli:
    requires: [check-cli]
    steps:
      - name: Create binary directory
        mkdir: bin
        when:
          commandExists: go

      - name: Build omniroute-cli
        shell: |
          VERSION="$(cat VERSION)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/omniroute-cli ./cmd/omniroute-cli
        when:
          commandExists: go

  pull:
    requires: [validate]
    steps:
      - name: Pull OmniRoute image
        dockerCompose:
          action: pull
          args: [ai-tools-omniroute]

      - name: Pull Open WebUI image
        dockerCompose:
          action: pull
          args: [ai-tools-omniroute-openwebui]

  rebuild:
    requires: [pull]
    steps:
      - name: Stop and remove existing containers
        dockerCompose:
          action: down
          removeOrphans: true

      - name: Recreate and start containers
        dockerCompose:
          action: up
          detach: true
          removeOrphans: true
          args: [--force-recreate]

      - name: Show container status
        dockerCompose:
          action: ps

  start:
    requires: [validate]
    steps:
      - name: Start existing containers
        dockerCompose:
          action: start

  stop:
    steps:
      - name: Stop containers
        dockerCompose:
          action: stop

  status:
    requires: [validate]
    steps:
      - name: Show container status
        dockerCompose:
          action: ps
