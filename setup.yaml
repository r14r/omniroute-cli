schemaVersion: 2

project:
  name: ai-tools-omniroute
  type: docker-compose
  description: Build omniroute-cli, securely initialize configuration, pull images and recreate the ai-tools-omniroute stack.

defaults:
  timeout: 20m
  failFast: true

requirements:
  commands:
    - docker
    - go

workflows:
  setup:
    tasks: [build-cli, rebuild]
  update:
    tasks: [build-cli, rebuild]
  rebuild:
    tasks: [rebuild]
  build-cli:
    tasks: [build-cli]
  check-cli:
    tasks: [check-cli]
  pull:
    tasks: [pull]
  start:
    tasks: [start]
  stop:
    tasks: [stop]
  status:
    tasks: [status]

tasks:
  prepare-env:
    steps:
      - name: Securely initialize or protect .env
        shell: |
          VERSION="$(cat VERSION)"
          go run -ldflags "-X main.version=${VERSION}" ./cmd/omniroute-cli init
          chmod 600 .env

  validate:
    requires: [prepare-env]
    steps:
      - name: Validate Docker Compose configuration
        dockerCompose:
          action: config
          args: [--quiet]

  check-cli:
    steps:
      - name: Validate semantic version
        shell: |
          VERSION="$(cat VERSION)"
          echo "${VERSION}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

      - name: Check Go formatting
        shell: |
          FILES="$(gofmt -l ./cmd ./src)"
          test -z "${FILES}" || { echo "Files require gofmt:"; echo "${FILES}"; exit 1; }

      - name: Run go vet
        command:
          exec: go
          args: [vet, ./...]

      - name: Run Go tests
        command:
          exec: go
          args: [test, ./...]

  build-cli:
    requires: [check-cli]
    steps:
      - name: Create binary directory
        mkdir: bin

      - name: Build omniroute-cli
        shell: |
          VERSION="$(cat VERSION)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/omniroute-cli ./cmd/omniroute-cli

  pull:
    requires: [validate]
    steps:
      - name: Pull OmniRoute image
        dockerCompose:
          action: pull
          args: [ai-tools-omniroute]

      - name: Pull Open WebUI image
        dockerCompose:
          action: pull
          args: [ai-tools-omniroute-openwebui]

  rebuild:
    requires: [pull]
    steps:
      - name: Recreate and start containers without explicit downtime
        dockerCompose:
          action: up
          detach: true
          removeOrphans: true
          args: [--force-recreate]

      - name: Show container status
        dockerCompose:
          action: ps

  start:
    requires: [validate]
    steps:
      - name: Start existing containers
        dockerCompose:
          action: start

  stop:
    steps:
      - name: Stop containers
        dockerCompose:
          action: stop

  status:
    requires: [validate]
    steps:
      - name: Show container status
        dockerCompose:
          action: ps
