name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate semantic version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          echo "${VERSION}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

      - name: Check formatting
        shell: bash
        run: |
          FILES="$(gofmt -l ./cmd ./src)"
          test -z "${FILES}" || { echo "Files require gofmt:"; echo "${FILES}"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          VERSION="$(cat VERSION)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/omniroute-cli ./cmd/omniroute-cli

      - name: CLI smoke test
        shell: bash
        run: |
          ./bin/omniroute-cli --help >/dev/null
          ./bin/omniroute-cli --version | grep -F "v$(cat VERSION)"
