name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate semantic version
        run: go run ./cmd/semver-check "$(cat VERSION)"
      - name: Check formatting
        shell: bash
        run: |
          FILES="$(gofmt -l ./cmd ./src)"
          test -z "$FILES" || { echo "Files require gofmt:"; echo "$FILES"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          VERSION="$(cat VERSION)"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/omniroute-cli ./cmd/omniroute-cli
          ./bin/omniroute-cli --version | grep -F "v${VERSION}"
      - name: Secure init smoke test
        shell: bash
        run: |
          ./bin/omniroute-cli init
          test "$(stat -c %a .env 2>/dev/null || stat -f %Lp .env)" = "600"
          ! grep -q '__GENERATE__' .env
          ! grep -q '^OMNIROUTE_INITIAL_PASSWORD=123456$' .env
      - name: Parse update-cli.yam
        run: ruby -e 'require "yaml"; YAML.load_file("update-cli.yam")'

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - name: Load justfile
        run: just --list >/dev/null
      - name: Build CLI
        run: just build
      - name: Validate Compose
        run: |
          ./bin/omniroute-cli init
          docker compose -f docker-compose.yaml config --quiet
      - name: Dry-run lifecycle matrix
        run: |
          ./bin/omniroute-cli --dry-run status
          ./bin/omniroute-cli --dry-run update --plan --json
          ./bin/omniroute-cli --dry-run recreate

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
