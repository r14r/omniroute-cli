name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate tag and VERSION semantically
        shell: bash
        run: |
          VERSION="$(go run ./cmd/semver-check "$(cat VERSION)")"
          TAG_VERSION="$(go run ./cmd/semver-check "${GITHUB_REF_NAME#v}")"
          test "$VERSION" = "$TAG_VERSION"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="$(cat VERSION)"
          NAME="omniroute-cli-v${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${NAME}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${NAME}/omniroute-cli" ./cmd/omniroute-cli
          cp README.md VERSION .env.example docker-compose.yaml update-cli.yam "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
